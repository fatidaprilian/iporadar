# Docker Compose development configuration for IPO Radar
# Uses Compose Specification (no version field needed)
# Ref: https://docs.docker.com/compose/compose-file/

services:
  # --- Python API (FastAPI Monolith) ---
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://iporadar:iporadar_dev@postgres:5432/iporadar
      - PORT=8000
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --- Next.js Frontend ---
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=iporadar
      - POSTGRES_PASSWORD=iporadar_dev
      - POSTGRES_DB=iporadar
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iporadar -d iporadar"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  web_node_modules:
