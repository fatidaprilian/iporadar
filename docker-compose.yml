# Docker Compose development configuration for IPO Radar
# Uses Compose Specification (no version field needed)
# Ref: https://docs.docker.com/compose/compose-file/

services:
  # --- NestJS API ---
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://iporadar:iporadar_dev@postgres:5432/iporadar
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
      - PORT=3001
    volumes:
      - ./apps/api/src:/app/src
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --- Python ML Service ---
  ml-service:
    build:
      context: ./apps/ml-service
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://iporadar_readonly:iporadar_dev@postgres:5432/iporadar
      - PORT=8000
    volumes:
      - ./apps/ml-service/app:/app/app
      - ./apps/ml-service/models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --- Next.js Frontend ---
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=iporadar
      - POSTGRES_PASSWORD=iporadar_dev
      - POSTGRES_DB=iporadar
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iporadar -d iporadar"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Redis ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  api_node_modules:
  web_node_modules:
